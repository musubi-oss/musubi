name: ue-probe

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "space-separated engine versions"
        default: "5.3.2 5.7.4 5.8.4"

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ue: ["5.3.2", "5.7.4", "5.8.4"]
    steps:
      - name: disk before
        run: df -h / /mnt; docker info --format '{{.DockerRootDir}}'
      - name: free the runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/microsoft /usr/lib/jvm \
            /usr/local/share/chromium /usr/local/lib/node_modules "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af >/dev/null || true
          sudo apt-get clean
          # docker data-root onto the large scratch disk
          sudo systemctl stop docker docker.socket
          sudo mkdir -p /mnt/docker
          echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          df -h / /mnt
      - name: pull
        run: |
          echo "${{ secrets.EPIC_GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.EPIC_GHCR_USER }}" --password-stdin
          time docker pull ghcr.io/epicgames/unreal-engine:dev-slim-${{ matrix.ue }}
          docker image inspect ghcr.io/epicgames/unreal-engine:dev-slim-${{ matrix.ue }} --format 'size {{.Size}} user {{.Config.User}} workdir {{.Config.WorkingDir}} env {{.Config.Env}}'
          df -h / /mnt
      - name: layout
        run: |
          I=ghcr.io/epicgames/unreal-engine:dev-slim-${{ matrix.ue }}
          docker run --rm $I bash -c 'echo HOME=$HOME; ls -la ~; ls ~/UnrealEngine 2>/dev/null | head; ls ~/UnrealEngine/Engine 2>/dev/null; ls ~/UnrealEngine/Engine/Build/BatchFiles 2>/dev/null; ls ~/UnrealEngine/Engine/Binaries/Linux 2>/dev/null | head -20; ls ~/UnrealEngine/Engine/Plugins 2>/dev/null | head -40; cat ~/UnrealEngine/Engine/Build/Build.version 2>/dev/null; du -sh ~/UnrealEngine/Engine/* 2>/dev/null | sort -h | tail -12; dotnet --version 2>/dev/null; which mono clang 2>/dev/null; ls ~/UnrealEngine/Engine/Extras/ThirdPartyNotUE/SDKs/HostLinux/Linux_x64 2>/dev/null'
