[package]
name = "musubi-unreal-gen"
description = "Generates the Unreal GDK wire layer (MusubiWire.generated.h/.cpp) from musubi-proto's Rust types"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
anyhow = "1"
proc-macro2 = "1"
quote = "1"
