name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: musubi
          POSTGRES_PASSWORD: musubi
          POSTGRES_DB: musubi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U musubi" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MUSUBI_TEST_DATABASE_URL: postgres://musubi:musubi@localhost:5432/musubi
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # integration tests start many nodes at once and finished tests keep their pools until the
      # binary exits; the image's default 100 connections overflow on a 4-thread runner
      - name: widen postgres connection limit
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U musubi -c "alter system set max_connections = 300"
          docker restart ${{ job.services.postgres.id }}
          for i in $(seq 1 30); do pg_isready -h localhost -U musubi && break; sleep 1; done
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  bench:
    # criterion micro-benches (plan 6.2): the last main run is the baseline, >5% slower fails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: restore baseline
        uses: actions/cache/restore@v4
        with:
          path: target/criterion
          key: criterion-baseline-${{ github.sha }}
          restore-keys: criterion-baseline-
      - run: cargo bench -p musubi-mesh -p musubi-proto -p musubi-auth --benches -- --noplot
      - run: python3 scripts/bench-compare.py 5
      - name: save baseline
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: target/criterion
          key: criterion-baseline-${{ github.sha }}
