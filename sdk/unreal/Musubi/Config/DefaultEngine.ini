; Engine defaults a UNetDriver subclass does not inherit from [/Script/OnlineSubsystemUtils.IpNetDriver] (tick rates, timeouts,
; channel definitions): without them a MusubiNet server ticks at 1 Hz and the control channel cannot open. Projects
; still add the NetDriverDefinitions entries themselves (README).
[/Script/MusubiNet.MusubiNetDriver]
NetConnectionClassName=/Script/MusubiNet.MusubiNetConnection
AllowPeerConnections=False
AllowPeerVoice=False
ConnectionTimeout=60.0
InitialConnectTimeout=60.0
RecentlyDisconnectedTrackingTime=120
TimeoutMultiplierForUnoptimizedBuilds=1
KeepAliveTime=0.2
MaxClientRate=100000
MaxInternetClientRate=100000
RelevantTimeout=5.0
SpawnPrioritySeconds=1.0
ServerTravelPause=4.0
NetServerMaxTickRate=30
MaxNetTickRate=120
MaxPortCountToTry=512
ResolutionConnectionTimeout=20.0

