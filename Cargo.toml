[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/musubi-oss/musubi"
rust-version = "1.85"

[workspace.dependencies]
musubi-core = { path = "crates/musubi-core" }
musubi-proto = { path = "crates/musubi-proto" }
musubi-cluster = { path = "crates/musubi-cluster" }
musubi-actor = { path = "crates/musubi-actor" }
musubi-fleet = { path = "crates/musubi-fleet" }
musubi-mesh = { path = "crates/musubi-mesh" }
musubi-sim-sdk = { path = "crates/musubi-sim-sdk" }
musubi-integrations = { path = "crates/musubi-integrations" }
musubi-economy = { path = "crates/musubi-economy" }
musubi-transport = { path = "crates/musubi-transport" }
musubi-edge = { path = "crates/musubi-edge" }
musubi-auth = { path = "crates/musubi-auth" }
musubi-account = { path = "crates/musubi-account" }
musubi-social = { path = "crates/musubi-social" }
musubi-chat = { path = "crates/musubi-chat" }
musubi-leaderboard = { path = "crates/musubi-leaderboard" }
musubi-matchmaker = { path = "crates/musubi-matchmaker" }
musubi-runtime = { path = "crates/musubi-runtime" }
musubi-storage = { path = "crates/musubi-storage" }
musubi-idl = { path = "crates/musubi-idl" }
musubi-server = { path = "crates/musubi-server" }

tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tonic = "0.12"
prost = "0.13"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "json", "migrate", "macros"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "reqwest-client"] }
tracing-opentelemetry = "0.34"
bytes = "1"
flate2 = "1"
postcard = { version = "1", features = ["alloc"] }
jsonwebtoken = "9"
argon2 = "0.5"
bcrypt = "0.15"
rand = "0.8"
sha2 = "0.10"
sha1 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
crc32fast = "1"
hex = "0.4"
regex = "1"
base64 = "0.22"
x25519-dalek = { version = "2", features = ["static_secrets"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
tokio-tungstenite = "0.24"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
rcgen = "0.13"
x509-parser = { version = "0.18", features = ["verify"] }
ring = "0.17"
openraft = { version = "0.9.25", features = ["serde", "storage-v2"] }
moka = { version = "0.12", features = ["future"] }
dashmap = "6"
clap = { version = "4", features = ["derive", "env"] }
config = "0.14"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2", "stream"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
