name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: musubi
          POSTGRES_PASSWORD: musubi
          POSTGRES_DB: musubi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U musubi" --health-interval 5s --health-timeout 5s --health-retries 10
    timeout-minutes: 60
    env:
      MUSUBI_TEST_DATABASE_URL: postgres://musubi:musubi@localhost:5432/musubi
      # the 7 GB / 14 GB hosted runner was being shut down mid-link ("runner has received a
      # shutdown signal", exit 143) while building the test binaries: fewer parallel rustc jobs
      # and no debuginfo keep peak memory and target size down
      # (still killed ~9 min into `cargo test` while compiling musubi-server with 2 jobs → 1)
      CARGO_BUILD_JOBS: 1
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      # incremental artifacts double the target dir; the 14 GB runner disk ran out at link time
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - name: free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # integration tests start many nodes at once and finished tests keep their pools until the
      # binary exits; the image's default 100 connections (and later 300) overflow on a 4-thread runner
      - name: widen postgres connection limit
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U musubi -c "alter system set max_connections = 1000"
          docker restart ${{ job.services.postgres.id }}
          for i in $(seq 1 30); do pg_isready -h localhost -U musubi && break; sleep 1; done
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # fleet_docker_provider_runs_a_container times its first `docker run`; pull the image outside the budget
      - run: docker pull -q alpine:3.20
      - run: cargo test --workspace
      # Unreal wire layer: generated C++ must match the Rust protocol, and the codecs must
      # reproduce Rust's JSON/postcard bytes (UE-free shim build, see sdk/unreal/tools).
      - run: cargo run -p musubi-unreal-gen -- --check
      - run: sdk/unreal/tools/syntax-check.sh
      - run: sdk/unreal/tools/wire-test.sh
      - run: sdk/unreal/tools/sim-wire-test.sh
      # QUIC transport: the C-ABI static library the MusubiQuic module links must build.
      - run: sdk/unreal/tools/build-quic-ffi.sh
  audit:
    # RUSTSEC advisories against Cargo.lock; accepted ones are listed with reasons in .cargo/audit.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  console:
    # operator console: typecheck, catalog paths against the node's OpenAPI snapshot, vitest, production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console2
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: console2/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: console2/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      # the server embeds console/dist; it must be the build of this tree
      - name: embedded dist is current
        run: |
          diff <(ls dist/assets | sort) <(ls ../console/dist/assets | sort) || { echo "console/dist is stale: run pnpm build && rm -rf ../console/dist && cp -r dist ../console/dist"; exit 1; }
  bench:
    # criterion micro-benches (plan 6.2): the base commit (PR base / previous push) is benched on the
    # same runner right before HEAD, so the comparison never crosses machines; >5% slower fails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: bench the base commit into the `main` baseline
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          case "$BASE" in ""|0000000000000000000000000000000000000000) BASE=$(git rev-parse HEAD~1 2>/dev/null || true);; esac
          if [ -z "$BASE" ]; then echo "no base commit, nothing to compare"; exit 0; fi
          git fetch --depth=1 origin "$BASE"
          git worktree add ../base "$BASE"
          (cd ../base && cargo bench --target-dir "$GITHUB_WORKSPACE/target" -p musubi-mesh -p musubi-proto -p musubi-auth --benches -- --noplot --save-baseline main)
      - run: cargo bench -p musubi-mesh -p musubi-proto -p musubi-auth --benches -- --noplot --baseline-lenient main
      - run: python3 scripts/bench-compare.py 5
