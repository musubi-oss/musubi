{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "musubi.fullname" . }}
  labels:
    {{- include "musubi.labels" . | nindent 4 }}
type: Opaque
stringData:
  MUSUBI__DATABASE__URL: {{ .Values.secrets.databaseUrl | quote }}
  MUSUBI__HTTP__SERVER_KEY: {{ .Values.secrets.serverKey | quote }}
{{- end }}
